<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pauta</title>
    <meta name="description" content="Pauta: sua rotina, um dia de cada vez. Água, treino, estudos, sono e o que mais fizer parte do seu dia, gravados na API de Tarefas." />
    <meta name="theme-color" content="#f0f0ed" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icone-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pauta" />
    <link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Aplica o tema salvo antes de desenhar a página (evita o "clarão" ao abrir no modo escuro).
      try {
        var tema = JSON.parse(localStorage.getItem('pauta:tema') || '"sistema"');
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
    <script src="js/vendor/charts.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>

    <div class="app" data-app>
      <aside class="lateral" data-lateral aria-label="Navegação"></aside>

      <header class="topo" data-topo></header>

      <div class="folha">
        <div class="faixa" data-faixa></div>
        <main id="conteudo" class="conteudo" data-conteudo tabindex="-1"></main>
      </div>

      <nav class="abas" data-abas aria-label="Principal"></nav>
    </div>

    <div class="aviso-arquivo" id="aviso-arquivo" hidden>
      <h1>Abra pelo Live Server</h1>
      <p>Este projeto usa módulos JavaScript, que o navegador não carrega direto do arquivo.</p>
      <p>No VS Code, clique com o botão direito em <code>index.html</code> e escolha <strong>Open with Live Server</strong>.</p>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('aviso-arquivo').hidden = false;
        document.querySelector('[data-app]').hidden = true;
      }
    </script>
    <noscript><p class="aviso-arquivo">Ative o JavaScript para usar o Pauta.</p></noscript>
  </body>
</html>
