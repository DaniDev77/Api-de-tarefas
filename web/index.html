<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pauta</title>
    <meta name="description" content="Pauta: tarefas da equipe, com prazo à vista. Quadro, lista, equipe e categorias integrados à API de Tarefas." />
    <meta name="theme-color" content="#F4F6FB" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Aplica o tema salvo antes de desenhar a página (evita o "clarão" ao abrir no modo escuro).
      try {
        var tema = JSON.parse(localStorage.getItem('pauta:tema') || '"sistema"');
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>

    <div class="app" data-app>
      <aside class="lateral" id="lateral" data-lateral aria-label="Navegação"></aside>
      <div class="lateral-fundo" data-fechar-lateral aria-hidden="true"></div>

      <div class="principal">
        <header class="topo">
          <div class="topo__inicio">
            <button type="button" class="botao-icone topo__menu" data-abrir-lateral aria-controls="lateral" aria-expanded="false" aria-label="Abrir navegação">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <a class="topo__marca" href="#/painel" data-topo-marca aria-label="Pauta, ir para o painel"></a>
          </div>
          <button type="button" class="busca-rapida" data-abrir-busca aria-label="Buscar tarefas, pessoas e ações (Ctrl+K)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <span class="busca-rapida__texto">Buscar tarefas, pessoas e ações</span>
            <kbd>Ctrl K</kbd>
          </button>
          <div class="topo__fim">
            <button type="button" class="botao-icone botao-icone--m" data-sincronizar aria-label="Sincronizar dados" data-dica="Sincronizar">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg>
            </button>
            <button type="button" class="botao-icone botao-icone--m" data-alternar-tema aria-label="Alternar tema claro e escuro" data-dica="Alternar tema">
              <svg class="so-claro" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>
              <svg class="so-escuro" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
            </button>
          </div>
        </header>

        <div class="folha">
          <aside class="faixa-demo" data-faixa-demo aria-label="Aviso do modo demonstração" hidden>
            <p>Modo demonstração: os dados ficam só neste navegador.</p>
            <button type="button" class="botao-texto" data-sair-demo>Conectar à API</button>
          </aside>
          <main id="conteudo" class="conteudo" data-conteudo tabindex="-1"></main>
        </div>
      </div>
    </div>

    <div class="aviso-arquivo" id="aviso-arquivo" hidden>
      <h1>Abra pelo Live Server</h1>
      <p>Este projeto usa módulos JavaScript, que o navegador não carrega direto do arquivo.</p>
      <p>No VS Code, clique com o botão direito em <code>index.html</code> e escolha <strong>Open with Live Server</strong>.</p>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('aviso-arquivo').hidden = false;
        document.querySelector('[data-app]').hidden = true;
      }
    </script>
    <noscript><p class="aviso-arquivo">Ative o JavaScript para usar o Pauta.</p></noscript>
  </body>
</html>
